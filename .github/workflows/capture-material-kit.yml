name: Capture Material Kit templates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out capture branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Puppeteer Core
        run: npm install --no-save puppeteer-core@24

      - name: Capture all complete page templates
        run: node capture.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-kit-pro-template-screenshots
          path: output/
          if-no-files-found: error
          compression-level: 6
          retention-days: 1
